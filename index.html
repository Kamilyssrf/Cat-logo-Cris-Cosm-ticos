<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b58b6a">
  <meta name="description" content="Catálogo online de produtos de beleza e perfumaria.">
  <title>Cris Cosméticos | Catálogo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="eyebrow">CATÁLOGO ONLINE</p>
        <h1>Cris Cosméticos</h1>
        <p class="subtitle">Beleza, perfumaria e cuidados para você.</p>
      </div>
      <div class="hero-badge">✨ Novidades</div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar" aria-label="Busca e filtros">
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar produto..." autocomplete="off"></label>
      <div id="categories" class="categories"></div>
    </section>

    <section class="section-head">
      <div>
        <p class="eyebrow">PRODUTOS</p>
        <h2>Encontre o que procura</h2>
      </div>
      <span id="count" class="count"></span>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty" hidden>Nenhum produto encontrado. Tente outro nome ou categoria.</p>
  </main>

  <footer>
    <p>© <span id="year"></span> Cris Cosméticos</p>
    <p class="small">Catálogo atualizado conforme a disponibilidade.</p>
  </footer>

  <script src="produtos.js"></script>
  <script src="script.js"></script>
</body>
</html>
